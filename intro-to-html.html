<!DOCTYPE html>
<html>
    <head>
        <title>My CSS practise</title>
        <link href="./intro-stylesheet.css" rel="stylesheet">

        <style>
            .internal {
                color: red;
              }
        </style>
    </head>
    <body>
        <h1>MY CSS Practise</h1>
        <hr>
        <p style="color:green;">This paragraph is styled using inline CSS.</p>
        <hr>
        <h2>Internal Style</h2>
        <p class="internal">This paragraph is styled using Internal CSS.</p>
        <hr>
        <p class="external"> This paragraph is styled using external CSS.</p>
    </body>
</html>
